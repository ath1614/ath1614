<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="100%" height="100%" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">End-to-End Payment &amp; Security Systems Topology — Atharv Soni</title>
  <desc id="arch-desc">Animated architectural blueprint showing how Atharv Soni's four flagship repositories (idem., Ledgerline, Recover, and Exposure) operate as an end-to-end payment and security pipeline.</desc>

  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A0F"/>
      <stop offset="100%" stop-color="#0B111A"/>
    </linearGradient>

    <linearGradient id="card-head" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <pattern id="arch-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.45"/>
    </pattern>

    <filter id="pkt-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    .pipe-dash {
      stroke-dasharray: 5 7;
      animation: flow 1.5s linear infinite;
    }
    @keyframes flow {
      to { stroke-dashoffset: -24; }
    }

    .pulse-dot {
      animation: blinkDot 2s ease-in-out infinite;
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .ladder-step-1 { animation: stepGlow 4s infinite 0s; }
    .ladder-step-2 { animation: stepGlow 4s infinite 1s; }
    .ladder-step-3 { animation: stepGlow 4s infinite 2s; }
    .ladder-step-4 { animation: stepGlow 4s infinite 3s; }

    @keyframes stepGlow {
      0%, 25% { stroke: #F59E0B; fill: #1F1608; }
      26%, 100% { stroke: #1E293B; fill: #0B111A; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>

  <!-- Outer Frame -->
  <rect width="1200" height="410" rx="12" fill="url(#arch-bg)" stroke="#1E293B" stroke-width="2"/>
  <rect width="1200" height="410" rx="12" fill="url(#arch-grid)"/>

  <!-- Section Header Bar -->
  <rect x="1" y="1" width="1198" height="40" rx="11" fill="#0B0F17"/>
  <line x1="0" y1="41" x2="1200" y2="41" stroke="#1E293B" stroke-width="1"/>
  <text x="28" y="25" class="mono" font-size="11.5" fill="#F59E0B" font-weight="600" letter-spacing="2">
    SYSTEMS TOPOLOGY // FOUR PRODUCTION REPOSITORIES · ONE VERIFIABLE PIPELINE
  </text>
  <text x="1172" y="25" text-anchor="end" class="mono" font-size="10.5" fill="#64748B" letter-spacing="1">
    STACK: TYPESCRIPT · REACT · HONO · CLOUDFLARE WORKERS · D1
  </text>

  <!-- ==================================================================== -->
  <!-- NODE 1: IDEM. (CONCURRENCY & EXACTLY-ONCE SIMULATOR)                 -->
  <!-- ==================================================================== -->
  <g transform="translate(24, 62)">
    <rect width="266" height="270" rx="8" fill="#090D14" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect width="266" height="36" rx="8" fill="#0C1928"/>
    <circle class="pulse-dot" cx="18" cy="18" r="4" fill="#38BDF8"/>
    <text x="32" y="22" class="mono" font-size="12" fill="#F8FAFC" font-weight="700">01 // idem.</text>
    <text x="252" y="22" text-anchor="end" class="mono" font-size="9.5" fill="#38BDF8">CONCURRENCY</text>

    <text x="16" y="58" class="sans" font-size="13.5" fill="#E2E8F0" font-weight="600">
      Exactly-Once Payment Simulator
    </text>
    <text x="16" y="78" class="sans" font-size="11.5" fill="#94A3B8">
      Deterministic simulator of two concurrent
    </text>
    <text x="16" y="94" class="sans" font-size="11.5" fill="#94A3B8">
      retries hitting one Idempotency-Key.
    </text>

    <!-- Visual Race Window Diagram -->
    <rect x="16" y="110" width="234" height="92" rx="6" fill="#06090E" stroke="#1E293B"/>
    <text x="26" y="127" class="mono" font-size="9.5" fill="#64748B">300 SEEDED SCHEDULES:</text>

    <!-- Strategy A: Check-then-write (Fails) -->
    <text x="26" y="147" class="mono" font-size="9.5" fill="#F43F5E">✗ check-then-write</text>
    <text x="240" y="147" text-anchor="end" class="mono" font-size="9.5" fill="#F43F5E">2× BILLED</text>

    <!-- Strategy B: Unique Key / Atomic Tx (Passes) -->
    <text x="26" y="167" class="mono" font-size="9.5" fill="#34D399">✓ unique-key + D1 tx</text>
    <text x="240" y="167" text-anchor="end" class="mono" font-size="9.5" fill="#34D399">0 DOUBLE-BILL</text>

    <line x1="26" y1="178" x2="240" y2="178" stroke="#1E293B"/>
    <text x="26" y="193" class="mono" font-size="9" fill="#38BDF8">Observable read-then-write window</text>

    <!-- Footer Pill -->
    <rect x="16" y="216" width="234" height="38" rx="5" fill="#0D1520" stroke="#1E293B"/>
    <text x="28" y="232" class="mono" font-size="9.5" fill="#64748B">REPO &amp; LIVE DEMO</text>
    <text x="28" y="246" class="mono" font-size="10.5" fill="#38BDF8" font-weight="600">github.com/ath1614/idem</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path id="conn-1-2" d="M 290 197 L 322 197" fill="none" stroke="#1E293B" stroke-width="2"/>
  <path class="pipe-dash" d="M 290 197 L 322 197" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <circle r="3.5" fill="#38BDF8" filter="url(#pkt-glow)">
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M 290 197 L 322 197"/>
  </circle>

  <!-- ==================================================================== -->
  <!-- NODE 2: LEDGERLINE (DOUBLE-ENTRY PAYMENT LEDGER)                     -->
  <!-- ==================================================================== -->
  <g transform="translate(322, 62)">
    <rect width="266" height="270" rx="8" fill="#090D14" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect width="266" height="36" rx="8" fill="#091E18"/>
    <circle class="pulse-dot" cx="18" cy="18" r="4" fill="#34D399"/>
    <text x="32" y="22" class="mono" font-size="12" fill="#F8FAFC" font-weight="700">02 // Ledgerline</text>
    <text x="252" y="22" text-anchor="end" class="mono" font-size="9.5" fill="#34D399">CORE LEDGER</text>

    <text x="16" y="58" class="sans" font-size="13.5" fill="#E2E8F0" font-weight="600">
      Double-Entry Payment Ledger
    </text>
    <text x="16" y="78" class="sans" font-size="11.5" fill="#94A3B8">
      Charges, refunds &amp; payouts in integer
    </text>
    <text x="16" y="94" class="sans" font-size="11.5" fill="#94A3B8">
      minor units + settlement CSV reconciliation.
    </text>

    <!-- Visual Atomic Batch Box -->
    <rect x="16" y="110" width="234" height="92" rx="6" fill="#06090E" stroke="#1E293B"/>
    <text x="26" y="127" class="mono" font-size="9.5" fill="#34D399">ATOMIC D1 BATCH (4 TABLES):</text>
    <text x="26" y="145" class="mono" font-size="9.5" fill="#E2E8F0">[event] → [entry] → [postings] → [key]</text>
    <text x="26" y="164" class="mono" font-size="9.5" fill="#94A3B8">• 30-day seeded traffic trial balance</text>
    <text x="26" y="180" class="mono" font-size="9.5" fill="#94A3B8">• Dispute CSV on fee/amount drift</text>
    <text x="26" y="195" class="mono" font-size="9.5" fill="#FBBF24">★ 41 Vitest + 500 fast-check pairs</text>

    <!-- Footer Pill -->
    <rect x="16" y="216" width="234" height="38" rx="5" fill="#0A1915" stroke="#1E293B"/>
    <text x="28" y="232" class="mono" font-size="9.5" fill="#64748B">REPO &amp; LIVE DEMO</text>
    <text x="28" y="246" class="mono" font-size="10.5" fill="#34D399" font-weight="600">github.com/ath1614/ledgerline</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 588 197 L 620 197" fill="none" stroke="#1E293B" stroke-width="2"/>
  <path class="pipe-dash" d="M 588 197 L 620 197" fill="none" stroke="#34D399" stroke-width="2"/>
  <circle r="3.5" fill="#34D399" filter="url(#pkt-glow)">
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M 588 197 L 620 197"/>
  </circle>

  <!-- ==================================================================== -->
  <!-- NODE 3: RECOVER (DUNNING DESK FOR FAILED PAYMENTS)                   -->
  <!-- ==================================================================== -->
  <g transform="translate(620, 62)">
    <rect width="266" height="270" rx="8" fill="#090D14" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect width="266" height="36" rx="8" fill="#1F1608"/>
    <circle class="pulse-dot" cx="18" cy="18" r="4" fill="#F59E0B"/>
    <text x="32" y="22" class="mono" font-size="12" fill="#F8FAFC" font-weight="700">03 // Recover</text>
    <text x="252" y="22" text-anchor="end" class="mono" font-size="9.5" fill="#FBBF24">DUNNING DESK</text>

    <text x="16" y="58" class="sans" font-size="13.5" fill="#E2E8F0" font-weight="600">
      Failed Renewal Recovery Engine
    </text>
    <text x="16" y="78" class="sans" font-size="11.5" fill="#94A3B8">
      4-step retry ladder with custom PBKDF2
    </text>
    <text x="16" y="94" class="sans" font-size="11.5" fill="#94A3B8">
      SHA-256 auth &amp; honest recovery math.
    </text>

    <!-- Animated 4-Step Retry Ladder -->
    <rect x="16" y="110" width="234" height="92" rx="6" fill="#06090E" stroke="#1E293B"/>
    <text x="26" y="127" class="mono" font-size="9.5" fill="#FBBF24">RETRY LADDER BEFORE WRITE-OFF:</text>

    <rect class="ladder-step-1" x="26" y="137" width="48" height="24" rx="4" fill="#0B111A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="50" y="153" text-anchor="middle" class="mono" font-size="10" fill="#F8FAFC">+1h</text>

    <rect class="ladder-step-2" x="81" y="137" width="48" height="24" rx="4" fill="#0B111A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="105" y="153" text-anchor="middle" class="mono" font-size="10" fill="#F8FAFC">+6h</text>

    <rect class="ladder-step-3" x="136" y="137" width="48" height="24" rx="4" fill="#0B111A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="160" y="153" text-anchor="middle" class="mono" font-size="10" fill="#F8FAFC">+1d</text>

    <rect class="ladder-step-4" x="191" y="137" width="48" height="24" rx="4" fill="#0B111A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="215" y="153" text-anchor="middle" class="mono" font-size="10" fill="#F8FAFC">+3d</text>

    <text x="26" y="178" class="mono" font-size="9" fill="#94A3B8">Auth: httpOnly digest + per-user salt</text>
    <text x="26" y="193" class="mono" font-size="9" fill="#34D399">Rate = ₹ Recovered / ₹ Resolved</text>

    <!-- Footer Pill -->
    <rect x="16" y="216" width="234" height="38" rx="5" fill="#181209" stroke="#1E293B"/>
    <text x="28" y="232" class="mono" font-size="9.5" fill="#64748B">REPO &amp; LIVE DEMO</text>
    <text x="28" y="246" class="mono" font-size="10.5" fill="#FBBF24" font-weight="600">github.com/ath1614/recover</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 886 197 L 918 197" fill="none" stroke="#1E293B" stroke-width="2"/>
  <path class="pipe-dash" d="M 886 197 L 918 197" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle r="3.5" fill="#F59E0B" filter="url(#pkt-glow)">
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M 886 197 L 918 197"/>
  </circle>

  <!-- ==================================================================== -->
  <!-- NODE 4: EXPOSURE (SSRF-HARDENED URL EXPOSURE SCANNER)                -->
  <!-- ==================================================================== -->
  <g transform="translate(918, 62)">
    <rect width="258" height="270" rx="8" fill="#090D14" stroke="#F43F5E" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect width="258" height="36" rx="8" fill="#220B12"/>
    <circle class="pulse-dot" cx="18" cy="18" r="4" fill="#F43F5E"/>
    <text x="32" y="22" class="mono" font-size="12" fill="#F8FAFC" font-weight="700">04 // Exposure</text>
    <text x="244" y="22" text-anchor="end" class="mono" font-size="9.5" fill="#FB7185">SEC SCANNER</text>

    <text x="16" y="58" class="sans" font-size="13.5" fill="#E2E8F0" font-weight="600">
      Server-Side URL Leak Scanner
    </text>
    <text x="16" y="78" class="sans" font-size="11.5" fill="#94A3B8">
      Audits 3rd-party trackers, cookies,
    </text>
    <text x="16" y="94" class="sans" font-size="11.5" fill="#94A3B8">
      6 headers &amp; leaked key strings.
    </text>

    <!-- SSRF Guard & Deduction Ledger Box -->
    <rect x="16" y="110" width="226" height="92" rx="6" fill="#06090E" stroke="#1E293B"/>
    <text x="26" y="127" class="mono" font-size="9.5" fill="#FB7185">SSRF-HARDENED FETCHER:</text>
    <text x="26" y="145" class="mono" font-size="9.5" fill="#E2E8F0">• Ports 80/443 · Private IPs refused</text>
    <text x="26" y="162" class="mono" font-size="9.5" fill="#E2E8F0">• Every HTTP redirect re-validated</text>
    <text x="26" y="179" class="mono" font-size="9.5" fill="#94A3B8">• Line-by-line deduction ledger</text>
    <text x="26" y="195" class="mono" font-size="9.5" fill="#34D399">★ 32 Vitest parser &amp; guard tests</text>

    <!-- Footer Pill -->
    <rect x="16" y="216" width="226" height="38" rx="5" fill="#1C0A11" stroke="#1E293B"/>
    <text x="28" y="232" class="mono" font-size="9.5" fill="#64748B">REPOSITORY</text>
    <text x="28" y="246" class="mono" font-size="10.5" fill="#FB7185" font-weight="600">github.com/ath1614/exposure</text>
  </g>

  <!-- Bottom Engineering Principle Banner -->
  <rect x="24" y="348" width="1152" height="44" rx="6" fill="#0B1018" stroke="#1E293B"/>
  <text x="44" y="374" class="mono" font-size="11" fill="#94A3B8">
    <tspan fill="#F59E0B" font-weight="600">ENGINEERING STANDARD //</tspan> Owns a feature end-to-end: TypeScript core, React interface, authenticated Hono Worker API on D1, and property tests that prove it.
  </text>
</svg>
