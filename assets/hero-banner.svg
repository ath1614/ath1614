    </text>

    <!-- Track 1: Primary Request (Accepted) -->
    <path id="req-path-1" d="M 22 72 L 195 72" fill="none" stroke="#1E293B" stroke-width="2"/>
    <path class="flow-dash" d="M 22 72 L 195 72" fill="none" stroke="#34D399" stroke-width="2"/>
    <circle r="4" fill="#34D399" filter="url(#soft-glow)">
      <animateMotion dur="2.1s" repeatCount="indefinite" path="M 22 72 L 195 72"/>
    </circle>
    <text x="24" y="66" class="mono" font-size="9.5" fill="#34D399">POST /v1/charges (Attempt #1)</text>

    <!-- Track 2: Concurrent Retry (Deduplicated at Gate) -->
    <path d="M 22 100 L 195 100" fill="none" stroke="#1E293B" stroke-width="2"/>
    <path class="flow-dash" d="M 22 100 L 195 100" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <circle r="3.5" fill="#F59E0B">
      <animateMotion dur="2.1s" begin="0.35s" repeatCount="indefinite" path="M 22 100 L 195 100"/>
    </circle>
    <text x="24" y="94" class="mono" font-size="9.5" fill="#FBBF24">POST /v1/charges (Concurrent Retry #2)</text>

    <!-- Unique Constraint / Atomic Lock Gate Box -->
    <rect x="198" y="58" width="128" height="54" rx="5" fill="#0D1922" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="262" y="79" text-anchor="middle" class="mono" font-size="10" fill="#38BDF8" font-weight="600">UNIQUE KEY LOCK</text>
    <text x="262" y="93" text-anchor="middle" class="mono" font-size="9" fill="#94A3B8">1× WRITE · 1× REPLAY</text>
    <text x="262" y="105" text-anchor="middle" class="mono" font-size="8.5" fill="#34D399">0 DOUBLE-BILLS</text>

    <!-- Output from Gate -->
    <path class="flow-dash" d="M 326 85 L 368 85" fill="none" stroke="#34D399" stroke-width="2"/>
    <rect x="370" y="63" width="96" height="44" rx="5" fill="#0B1F17" stroke="#10B981" stroke-width="1"/>
    <text x="418" y="82" text-anchor="middle" class="mono" font-size="10" fill="#34D399" font-weight="600">HTTP 200 OK</text>
    <text x="418" y="96" text-anchor="middle" class="mono" font-size="8.5" fill="#A7F3D0">Cached Payload</text>

    <line x1="18" y1="126" x2="467" y2="126" stroke="#1E293B" stroke-width="1"/>

    <!-- Section 2: Balanced Journal Entry (Integer Minor Units) -->
    <text x="18" y="146" class="mono" font-size="10" fill="#64748B" letter-spacing="1">
      2. ATOMIC D1 JOURNAL POSTINGS (INTEGER MINOR UNITS · PAISE)
    </text>

    <!-- Ledger Table -->
    <rect x="18" y="156" width="449" height="78" rx="5" fill="#0A0F18" stroke="#1E293B" stroke-width="1"/>
    <line x1="18" y1="178" x2="467" y2="178" stroke="#1E293B" stroke-width="1"/>

    <text x="30" y="171" class="mono" font-size="9.5" fill="#64748B">ACCOUNT</text>
    <text x="220" y="171" class="mono" font-size="9.5" fill="#64748B">DIRECTION</text>
    <text x="330" y="171" class="mono" font-size="9.5" fill="#64748B">MINOR UNITS</text>
    <text x="455" y="171" text-anchor="end" class="mono" font-size="9.5" fill="#64748B">STATUS</text>

    <!-- Row 1 -->
