    <text x="220" y="195" class="mono" font-size="10.5" fill="#38BDF8">DEBIT (+)</text>
    <text x="330" y="195" class="mono" font-size="10.5" fill="#F8FAFC" font-weight="600">249900</text>
    <text x="455" y="195" text-anchor="end" class="mono" font-size="10" fill="#34D399">LOCKED</text>

    <!-- Row 2 -->
    <text x="30" y="213" class="mono" font-size="10.5" fill="#E2E8F0">acct:merchant_payable</text>
    <text x="220" y="213" class="mono" font-size="10.5" fill="#FBBF24">CREDIT (−)</text>
    <text x="330" y="213" class="mono" font-size="10.5" fill="#F8FAFC" font-weight="600">244902</text>
    <text x="455" y="213" text-anchor="end" class="mono" font-size="10" fill="#34D399">LOCKED</text>

    <!-- Row 3 -->
    <text x="30" y="229" class="mono" font-size="10.5" fill="#E2E8F0">acct:platform_fee_rev</text>
    <text x="220" y="229" class="mono" font-size="10.5" fill="#FBBF24">CREDIT (−)</text>
    <text x="330" y="229" class="mono" font-size="10.5" fill="#F8FAFC" font-weight="600">004998</text>
    <text x="455" y="229" text-anchor="end" class="mono" font-size="10" fill="#34D399">LOCKED</text>

    <!-- Bottom Conservation Bar -->
