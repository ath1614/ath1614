    <circle cx="16" cy="15" r="4" fill="#EF4444" opacity="0.8"/>
    <circle cx="30" cy="15" r="4" fill="#F59E0B" opacity="0.8"/>
    <circle cx="44" cy="15" r="4" fill="#10B981" opacity="0.8"/>
    <text x="62" y="19" class="mono" font-size="10.5" fill="#94A3B8" letter-spacing="1">
      D1_ATOMIC_BATCH // IDEMPOTENT_LEDGER_ENGINE
    </text>
    <text x="470" y="19" text-anchor="end" class="mono" font-size="10" fill="#34D399">
