<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Atharv Soni — Payment Infrastructure, Double-Entry Ledgers &amp; Applied AI/ML Engineer</title>
  <desc id="hero-desc">Animated engineering telemetry console for Atharv Soni (ath1614), B.Tech AI &amp; ML undergraduate (CGPA 9.6/10) building double-entry payment ledgers, idempotent ingest engines, and SSRF-hardened scanners on TypeScript, React, Hono, and Cloudflare Workers D1.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A0F"/>
      <stop offset="55%" stop-color="#0C121C"/>
      <stop offset="100%" stop-color="#080C12"/>
    </linearGradient>

    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <pattern id="blueprint-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.55"/>
    </pattern>

    <pattern id="fine-dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.65" fill="#334155" opacity="0.45"/>
    </pattern>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .serif { font-family: 'Georgia', 'Times New Roman', serif; }

    .scanline {
      animation: sweep 9s linear infinite;
    }
    @keyframes sweep {
      0% { transform: translateY(-120px); }
      100% { transform: translateY(420px); }
    }

    .pulse-green {
      animation: pulseG 2.2s ease-in-out infinite;
    }
    @keyframes pulseG {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .pulse-amber {
      animation: pulseA 2.8s ease-in-out infinite;
    }
    @keyframes pulseA {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.35; }
    }

    .flow-dash {
      stroke-dasharray: 6 8;
      animation: dashFlow 1.6s linear infinite;
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -28; }
    }

    .cursor-blink {
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .fade-rise-1 { animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.05s backwards; }
    .fade-rise-2 { animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.18s backwards; }
    .fade-rise-3 { animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.32s backwards; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
    }

    .retry- reject {
      animation: rejectFlash 3.6s ease-in-out infinite;
    }
    @keyframes rejectFlash {
      0%, 40%, 100% { opacity: 0.35; }
      50%, 75% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>

  <!-- Outer Card Background & Blueprint Grid -->
  <rect width="1200" height="380" rx="12" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2"/>
  <rect width="1200" height="380" rx="12" fill="url(#blueprint-grid)"/>
  <rect width="1200" height="380" rx="12" fill="url(#fine-dots)"/>

  <!-- Sweeping Telemetry Scanline -->
  <rect class="scanline" x="2" y="0" width="1196" height="90" fill="url(#scan-grad)" pointer-events="none"/>

  <!-- Top Perimeter Instrument Bar -->
  <rect x="1" y="1" width="1198" height="36" rx="11" fill="#0B0F17" opacity="0.9"/>
  <line x1="0" y1="37" x2="1200" y2="37" stroke="#1E293B" stroke-width="1"/>
  <line x1="24" y1="37" x2="290" y2="37" stroke="url(#gold-accent)" stroke-width="2"/>

  <!-- Top Bar Telemetry Labels -->
  <circle class="pulse-green" cx="28" cy="19" r="4.5" fill="#34D399"/>
  <text x="42" y="23" class="mono" font-size="11" fill="#94A3B8" letter-spacing="1.5">
    SYS.NODE // <tspan fill="#F8FAFC" font-weight="600">ATH1614</tspan> · PUNE, IN [18.52°N, 73.85°E]
  </text>

  <text x="610" y="23" class="mono" font-size="11" fill="#64748B" letter-spacing="1.2">
    INVARIANT: <tspan fill="#34D399">∑ DEBITS − ∑ CREDITS == 0</tspan>
  </text>

  <rect x="1032" y="9" width="146" height="20" rx="4" fill="#111C24" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="1105" y="22.5" text-anchor="middle" class="mono" font-size="10" fill="#34D399" font-weight="600" letter-spacing="1">
    ● ALL TESTS PASSING
  </text>

  <!-- Corner Registration Marks -->
  <path d="M 16 52 L 16 44 L 24 44" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <path d="M 1184 52 L 1184 44 L 1176 44" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <path d="M 16 360 L 16 368 L 24 368" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <path d="M 1184 360 L 1184 368 L 1176 368" fill="none" stroke="#F59E0B" stroke-width="1.5"/>

  <!-- ==================================================================== -->
  <!-- LEFT COLUMN: IDENTITY, ENGINEERING THESIS & KEY METRICS              -->
  <!-- ==================================================================== -->
  <g class="fade-rise-1">
    <text x="44" y="78" class="mono" font-size="11.5" fill="#F59E0B" letter-spacing="2.5" font-weight="600">
      PAYMENT INFRASTRUCTURE · APPLIED AI/ML · FULL-STACK SYSTEMS
    </text>

    <text x="42" y="134" class="sans" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1.2">
      Atharv Soni
    </text>

    <!-- Gold Monograph Tag beside name -->
    <rect x="355" y="102" width="164" height="26" rx="4" fill="#1C160B" stroke="#F59E0B" stroke-width="1"/>
    <text x="437" y="119" text-anchor="middle" class="mono" font-size="11" fill="#FBBF24" font-weight="600" letter-spacing="0.8">
      B.TECH AI &amp; ML · 9.6 CGPA
    </text>
  </g>

  <g class="fade-rise-2">
    <text x="44" y="174" class="sans" font-size="15.5" fill="#CBD5E1" font-weight="400">
      Building financial &amp; security systems where correctness is observable:
    </text>
    <text x="44" y="198" class="sans" font-size="15.5" fill="#94A3B8">
      <tspan fill="#F8FAFC" font-weight="600">double-entry ledgers</tspan> that must balance, <tspan fill="#38BDF8" font-weight="600">idempotent ingest</tspan> that survives
    </text>
    <text x="44" y="222" class="sans" font-size="15.5" fill="#94A3B8">
      concurrent retries, and <tspan fill="#FBBF24" font-weight="600">SSRF-hardened scanners</tspan> that itemize what a page leaks.
    </text>

    <!-- Terminal Command Line Readout -->
    <rect x="44" y="242" width="600" height="36" rx="6" fill="#06090E" stroke="#1E293B" stroke-width="1.2"/>
    <text x="58" y="264" class="mono" font-size="12" fill="#64748B">
      ath1614@d1-edge:~$ <tspan fill="#34D399">vitest run --coverage</tspan> <tspan fill="#94A3B8">&amp;&amp;</tspan> <tspan fill="#38BDF8">wrangler deploy</tspan>
    </text>
    <rect class="cursor-blink" x="524" y="252" width="7" height="15" fill="#F59E0B"/>
  </g>

  <!-- Bottom Left Proof Strip Badges -->
  <g class="fade-rise-3">
    <!-- Pill 1 -->
    <rect x="44" y="296" width="188" height="48" rx="6" fill="#0D131D" stroke="#1E293B" stroke-width="1"/>
    <line x1="44" y1="296" x2="44" y2="344" stroke="#F59E0B" stroke-width="3"/>
    <text x="58" y="315" class="mono" font-size="10" fill="#64748B" letter-spacing="1">PRODUCTION AI / ML</text>
    <text x="58" y="333" class="sans" font-size="13" fill="#F8FAFC" font-weight="600">RBI Deepfake &amp; INDIAai OCR</text>

    <!-- Pill 2 -->
    <rect x="246" y="296" width="194" height="48" rx="6" fill="#0D131D" stroke="#1E293B" stroke-width="1"/>
    <line x1="246" y1="296" x2="246" y2="344" stroke="#34D399" stroke-width="3"/>
    <text x="260" y="315" class="mono" font-size="10" fill="#64748B" letter-spacing="1">PROPERTY-TESTED CORE</text>
    <text x="260" y="333" class="sans" font-size="13" fill="#F8FAFC" font-weight="600">73+ Vitest &amp; fast-check</text>

    <!-- Pill 3 -->
    <rect x="454" y="296" width="190" height="48" rx="6" fill="#0D131D" stroke="#1E293B" stroke-width="1"/>
    <line x1="454" y1="296" x2="454" y2="344" stroke="#38BDF8" stroke-width="3"/>
    <text x="468" y="315" class="mono" font-size="10" fill="#64748B" letter-spacing="1">COMPETITIVE HONORS</text>
    <text x="468" y="333" class="sans" font-size="13" fill="#F8FAFC" font-weight="600">World Finalist · Wild Bugs</text>
  </g>

