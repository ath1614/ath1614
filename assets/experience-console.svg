    </text>

    <line x1="16" y1="90" x2="348" y2="90" stroke="#1E293B"/>

    <text x="16" y="112" class="sans" font-size="12" fill="#CBD5E1">
      • Built <tspan fill="#FBBF24" font-weight="600">deepfake detection models for the RBI</tspan>
    </text>
    <text x="26" y="128" class="sans" font-size="12" fill="#94A3B8">
