  <circle class="active-beacon" cx="600" cy="70" r="4.5" fill="#F59E0B"/>

  <g transform="translate(418, 92)">
    <rect width="364" height="204" rx="8" fill="#090D14" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect x="16" y="14" width="152" height="20" rx="4" fill="#1F1608" stroke="#F59E0B" stroke-width="0.8"/>
    <text x="92" y="27.5" text-anchor="middle" class="mono" font-size="9.5" fill="#FBBF24" font-weight="600">
