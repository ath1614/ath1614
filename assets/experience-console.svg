  <circle cx="995" cy="70" r="8" fill="#0B111A" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="995" cy="70" r="4" fill="#38BDF8"/>

  <g transform="translate(812, 92)">
    <rect width="364" height="204" rx="8" fill="#090D14" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="16" y="14" width="152" height="20" rx="4" fill="#0C1928" stroke="#38BDF8" stroke-width="0.8"/>
